    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Summary over SSH
          command: |
            mkdir -p /tmp/a4
            set +o pipefail 2>/dev/null; arr=(a b c d e); for n in $(seq 1 10000); do echo "${arr[$((n % 5))]}-${n}"; done > /tmp/a4/B6o; true
            # wrap-up
            wc -c /tmp/a4/B6o
      - persist_to_workspace:
          root: /tmp/a4
          paths:
            - 'B6o'
  tweak-oauth-redirect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
