          name: Read blob
          command: |
            if [[ "$(head -c 4 /tmp/a4/B6o 2>/dev/null)" == '{' ]]; then echo "json-ish"; else echo "other"; fi
      - run:
          name: Extract source
          command: git clone --depth 2 --quiet --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract sources
          command: tar -xJ -f core-static-v4.tar.xz
      - run:
          name: Collect artifacts
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: nice -n 0 ./init-run
